<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KG-Gerät · Foliendeck</title>
<style>
  :root { --ink:#1F342D; --paper:#FFFFFF; --accent:#D99129; --muted:#9BAAA4; --line:#33493F; --warn:#E8C06A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .karte { width: 100%; max-width: 420px; }
  .kicker { color: var(--accent); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; margin: 0 0 14px; }
  h1 { font-size: 34px; line-height: 1.1; margin: 0 0 10px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 28px; font-size: 16px; }
  label { display: block; font-size: 14px; margin-bottom: 8px; color: var(--muted); }
  input { width: 100%; font: inherit; font-size: 18px; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--paper); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button { margin-top: 14px; width: 100%; font: inherit; font-weight: 700; font-size: 17px; padding: 14px;
    border: 0; border-radius: 10px; background: var(--accent); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .meldung { min-height: 24px; margin-top: 14px; color: var(--warn); font-size: 15px; }
  .fuss { margin-top: 40px; font-size: 13px; color: var(--muted); }
  .fuss b { color: var(--paper); }
</style>
</head>
<body>
<main>
  <form class="karte" id="tor" autocomplete="off">
    <p class="kicker">REHAB FIVE ACADEMY</p>
    <h1>KG-Gerät · Foliendeck</h1>
    <p>Arbeitsstand, nur für den internen Gebrauch. Bitte das Passwort eingeben.</p>
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="los" type="submit">Öffnen</button>
    <div class="meldung" id="meldung" role="status"></div>
    <div class="fuss">Steuerung im Deck: <b>→</b> weiter, <b>←</b> zurück, <b>Ü</b> Übersicht, <b>V</b> Vollbild, <b>?</b> Hilfe</div>
  </form>
</main>
<script>
(async () => {
  const meld = (t) => (document.getElementById("meldung").textContent = t);
  const knopf = document.getElementById("los");
  if (!("serviceWorker" in navigator) || !window.crypto || !crypto.subtle) {
    meld("Dieser Browser kann das Deck nicht öffnen. Bitte Chrome, Safari, Edge oder Firefox in aktueller Version nutzen.");
    knopf.disabled = true; return;
  }
  const reg = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  // Schon entsperrt auf diesem Gerät? Dann direkt hinein.
  try {
    const t = await fetch("deck/daten/reihenfolge.json", { cache: "no-store" });
    if (t.ok && navigator.serviceWorker.controller) { location.replace("deck/"); return; }
  } catch (e) {}

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  document.getElementById("tor").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    knopf.disabled = true; meld("Wird geprüft …");
    try {
      const pw = new TextEncoder().encode(document.getElementById("pw").value);
      const basis = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveKey"]);
      const liste = await (await fetch("d/keys.json", { cache: "no-store" })).json();
      let roh = null;
      for (const e of liste) {
        const kek = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(e.s), iterations: 250000, hash: "SHA-256" },
          basis, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        const k = b64(e.k);
        try { roh = await crypto.subtle.decrypt({ name: "AES-GCM", iv: k.slice(0, 12) }, kek, k.slice(12)); break; }
        catch (x) {}
      }
      if (!roh) { meld("Das Passwort stimmt nicht."); knopf.disabled = false; return; }
      const sw = reg.active || navigator.serviceWorker.controller;
      await new Promise((ok) => {
        navigator.serviceWorker.addEventListener("message", function h(m) {
          if (m.data && m.data.typ === "gespeichert") { navigator.serviceWorker.removeEventListener("message", h); ok(); }
        });
        sw.postMessage({ typ: "schluessel", roh });
      });
      meld("Wird geöffnet …");
      location.href = "deck/";
    } catch (x) {
      console.error(x);
      meld("Das hat nicht geklappt. Bitte die Seite neu laden und noch einmal versuchen.");
      knopf.disabled = false;
    }
  });
})();
</script>
</body>
</html>
